# .github/workflows/release-images.yml
name: Release Images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker_build_push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write

    env:
      ADMIN_DOMAIN: ${{ vars.ADMIN_DOMAIN }}
      STOREFRONT_DOMAIN: ${{ vars.STOREFRONT_DOMAIN }}
      # Optional PAT. If empty, we fall back to GITHUB_TOKEN.
      GHCR_PAT: ${{ secrets.GHCR_TOKEN }}
      # Optional explicit username for PAT mode. If empty, we default to 'alvi-noman'.
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            file: services/api-gateway/Dockerfile
            context: .
            image_suffix: qravy-api-gateway
            build_args: ""
          - name: auth
            file: services/auth-service/Dockerfile
            context: .
            image_suffix: qravy-auth
            build_args: ""
          - name: upload
            file: services/upload-service/Dockerfile
            context: .
            image_suffix: qravy-upload
            build_args: ""
          - name: storefront-host
            file: services/storefront-host/Dockerfile
            context: .
            image_suffix: qravy-storefront-host
            build_args: ""
          - name: ai-waiter
            file: services/ai-waiter-service/Dockerfile
            context: services/ai-waiter-service
            image_suffix: qravy-ai-waiter
            build_args: ""
          - name: braincell
            file: apps/Dockerfile.prod
            context: .
            image_suffix: qravy-braincell
            build_args: |
              APP=braincell
              VITE_API_URL=https://${{ vars.ADMIN_DOMAIN }}
              VITE_AI_WAITER_API=/waiter
              VITE_STOREFRONT_URL=https://${{ vars.STOREFRONT_DOMAIN }}/t/{subdomain}
          - name: tastebud
            file: apps/Dockerfile.prod
            context: .
            image_suffix: qravy-tastebud
            build_args: |
              APP=tastebud
              VITE_API_URL=/api/v1
              VITE_AI_WAITER_API=/cart-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require frontend domains
        if: matrix.service.name == 'braincell' || matrix.service.name == 'tastebud'
        run: |
          test -n "$ADMIN_DOMAIN"
          test -n "$STOREFRONT_DOMAIN"

      - name: Vars
        id: vars
        run: |
          echo "STAMP=$(date +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"
          echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "SHA_FULL=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute lowercase owner
        id: ow
        run: |
          echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Docker logout GHCR (cleanup)
        run: docker logout ghcr.io || true

      # Compute a safe username for PAT mode without expressions
      - name: Decide GHCR username for PAT
        if: ${{ env.GHCR_PAT != '' }}
        run: |
          if [ -n "${GHCR_USERNAME}" ]; then
            echo "GHCR_LOGIN_USER=${GHCR_USERNAME}" >> "$GITHUB_ENV"
          else
            echo "GHCR_LOGIN_USER=alvi-noman" >> "$GITHUB_ENV"
          fi

      - name: Login to GHCR (PAT)
        if: ${{ env.GHCR_PAT != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_LOGIN_USER }}
          password: ${{ env.GHCR_PAT }}

      - name: Login to GHCR (GITHUB_TOKEN)
        if: ${{ env.GHCR_PAT == '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GHCR login
        run: |
          set -e
          if [ ! -f "$HOME/.docker/config.json" ]; then
            echo "No Docker config.json found"
            exit 1
          fi
          if ! cat "$HOME/.docker/config.json" | tr -d '\n' | grep -q 'ghcr.io'; then
            echo "ERROR: Not logged into ghcr.io"
            exit 1
          fi
          echo "Logged into ghcr.io"

      - name: Build & Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.ow.outputs.OWNER_LC }}/${{ matrix.service.image_suffix }}:prod
            ghcr.io/${{ steps.ow.outputs.OWNER_LC }}/${{ matrix.service.image_suffix }}:sha-${{ steps.vars.outputs.SHA_FULL }}
            ghcr.io/${{ steps.ow.outputs.OWNER_LC }}/${{ matrix.service.image_suffix }}:prod-${{ steps.vars.outputs.STAMP }}-${{ steps.vars.outputs.SHA_SHORT }}
          build-args: ${{ matrix.service.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.SHA_FULL }}
            org.opencontainers.image.title=${{ matrix.service.name }}
            org.opencontainers.image.created=${{ steps.vars.outputs.STAMP }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_contabo:
    name: Deploy GHCR images to Contabo
    needs: docker_build_push
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment config
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        env:
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          CONTABO_KNOWN_HOSTS: ${{ secrets.CONTABO_KNOWN_HOSTS }}
        run: |
          test -n "$CONTABO_SSH_KEY"
          test -n "$CONTABO_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$CONTABO_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$CONTABO_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload Compose and Caddy config
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_USER }}
          CONTABO_DEPLOY_PATH: ${{ vars.CONTABO_DEPLOY_PATH }}
        run: |
          test -n "$CONTABO_HOST"
          test -n "$CONTABO_USER"
          test -n "$CONTABO_DEPLOY_PATH"
          SSH_TARGET="$CONTABO_USER@$CONTABO_HOST"
          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=yes"
          ssh $SSH_OPTS "$SSH_TARGET" "mkdir -p '$CONTABO_DEPLOY_PATH/runtime'"
          scp $SSH_OPTS compose.production.yml Caddyfile "$SSH_TARGET:$CONTABO_DEPLOY_PATH/"

      - name: Pull and restart Contabo stack
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_USER }}
          CONTABO_DEPLOY_PATH: ${{ vars.CONTABO_DEPLOY_PATH }}
          GHCR_READ_USER: ${{ secrets.GHCR_READ_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          test -n "$GHCR_READ_USER"
          test -n "$GHCR_READ_TOKEN"
          SSH_TARGET="$CONTABO_USER@$CONTABO_HOST"
          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=yes"
          printf '%s' "$GHCR_READ_TOKEN" | ssh $SSH_OPTS "$SSH_TARGET" \
            "docker login ghcr.io --username '$GHCR_READ_USER' --password-stdin"
          ssh $SSH_OPTS "$SSH_TARGET" \
            "cd '$CONTABO_DEPLOY_PATH' && IMAGE_TAG='sha-$DEPLOY_SHA' docker compose --env-file .env.production -f compose.production.yml pull && IMAGE_TAG='sha-$DEPLOY_SHA' docker compose --env-file .env.production -f compose.production.yml up -d --remove-orphans"
