server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # files to download (the rider app's Android app): the file, or a real 404 — never the app's page instead
    location /download/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}