version: "3.9"

services:
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file:
      - ./services/auth-service/.env
    environment:
      NODE_ENV: development
      PORT: "3001"
      AI_WAITER_HTTP_URL: http://ai-waiter-service:7081
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5501}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5501}
      # AI menu import (PDF/photos) — same key as the AI waiter, from the root .env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MENU_IMPORT_MODEL: ${MENU_IMPORT_MODEL:-gpt-4.1-mini}
    working_dir: /app/services/auth-service
    ports:
      - "3001:3001"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    command: ["pnpm", "run", "dev"]
    depends_on:
      - ai-waiter-service

  upload-service:
    build:
      context: .
      dockerfile: services/upload-service/Dockerfile
    env_file:
      - ./services/upload-service/.env
    environment:
      NODE_ENV: development
      PORT: "4010"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5501}
      UPLOAD_TOKEN: ${UPLOAD_SERVICE_TOKEN:?Set UPLOAD_SERVICE_TOKEN (OS env or root .env)}
    working_dir: /app/services/upload-service
    ports:
      - "4010:4010"
    depends_on:
      - auth-service
    restart: unless-stopped
    command: ["pnpm", "run", "dev"]

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    env_file:
      - ./services/api-gateway/.env
    environment:
      NODE_ENV: development
      PORT: "8080"
      HOST: "0.0.0.0"
      # Allow all local apps (added Tastebud dev :3007 to avoid CORS issues)
      CORS_ORIGIN: "http://localhost:5501,https://localhost:5501,http://127.0.0.1:5501,https://127.0.0.1:5501,http://localhost:8090,https://localhost:8090,http://localhost:3007,https://localhost:3007"
      AUTH_SERVICE_URL: http://auth-service:3001
      UPLOAD_SERVICE_URL: http://upload-service:4010
      UPLOAD_SERVICE_TOKEN: ${UPLOAD_SERVICE_TOKEN:?Set UPLOAD_SERVICE_TOKEN (OS env or root .env)}
      # ✅ WS target for AI Waiter
      VOICE_WS_TARGET: http://ai-waiter-service:7071
      # ✅ Azure Speech credentials
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:?Set AZURE_SPEECH_KEY in your .env}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:?Set AZURE_SPEECH_REGION in your .env}
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - upload-service
      - ai-waiter-service
    restart: unless-stopped

  storefront-host:
    build:
      context: .
      dockerfile: services/storefront-host/Dockerfile
    env_file:
      - ./services/storefront-host/.env
    environment:
      NODE_ENV: development
      PORT: "8090"
      HOST: "0.0.0.0"
      # storefront-host (container) -> Vite (tastebud container)
      TASTEBUD_DEV_URL: http://tastebud:3007
      # storefront-host (container) -> api-gateway (container)
      GATEWAY_URL: http://api-gateway:8080
      # Allow local Vite + storefront origins
      CORS_ORIGIN: "http://localhost:3007,https://localhost:3007,http://localhost:8090,https://localhost:8090,http://localhost:5501,https://localhost:5501"
      AI_WAITER_URL: http://ai-waiter-service:7071
    ports:
      - "8090:8090"
    depends_on:
      - api-gateway
      - tastebud
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # === Frontends (Vite dev servers with HMR; source is bind-mounted) ===
  braincell:
    build:
      context: .
      dockerfile: apps/Dockerfile.dev
      args:
        APP: braincell
    environment:
      VITE_BIND_HOST: "0.0.0.0"
      VITE_USE_POLLING: "true"
      API_PROXY_TARGET: http://api-gateway:8080
    ports:
      - "5501:5501"
    volumes:
      - ./apps/braincell:/repo/apps/braincell
      - ./packages/shared:/repo/packages/shared
      # keep the container's Linux node_modules, not the Windows ones
      - /repo/apps/braincell/node_modules
      - /repo/packages/shared/node_modules
    depends_on:
      - api-gateway
    restart: unless-stopped

  tastebud:
    build:
      context: .
      dockerfile: apps/Dockerfile.dev
      args:
        APP: tastebud
    environment:
      VITE_USE_POLLING: "true"
      VOICE_WS_PROXY_TARGET: ws://ai-waiter-service:7071
    ports:
      - "3007:3007"
    volumes:
      - ./apps/tastebud:/repo/apps/tastebud
      - ./packages/shared:/repo/packages/shared
      - /repo/apps/tastebud/node_modules
      - /repo/packages/shared/node_modules
    depends_on:
      - ai-waiter-service
    restart: unless-stopped

  # === Persistence for transcripts ===
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # === AI Waiter (ASR + Brain in one service) ===
  ai-waiter-service:
    build:
      context: ./services/ai-waiter-service
    env_file:
      - ./services/ai-waiter-service/.env   # contains MONGO_URI for Atlas (kept out of git)
    environment:
      - PORT=7071
      - WHISPER_MODEL=tiny
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_LANG=auto
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1

      # === Groq Whisper v3 (for finalize) ===
      - GROQ_API_KEY=${GROQ_API_KEY:?Set GROQ_API_KEY in your .env}
      - GROQ_MODEL=whisper-large-v3
      - GROQ_BASE=https://api.groq.com
      - GROQ_TIMEOUT_MS=6000

      # === Mongo / menu snapshot for grounding ===
      - MONGO_DB=qravy
      - MENU_DB=authDB
      - MENU_COLLECTION=menuItems

      # === Normalizer knobs ===
      - NORMALIZER_FUZZY_THRESHOLD=0.87
      - NORMALIZER_VOCAB_MAX=200
      - MENU_SNAPSHOT_MAX=120
      - NORMALIZER_INCLUDE_ALIASES=1

      # === Speech-to-text: the full model is much better at Bangla (~$0.006 / min of speech) ===
      - OPENAI_STT_MODEL=gpt-4o-transcribe

      # === OpenAI brain (GPT-4.1-mini) ===
      - OPENAI_API_KEY=${OPENAI_API_KEY:?Set OPENAI_API_KEY in your .env}
      - OPENAI_BASE=https://api.openai.com
      - OPENAI_CHAT_MODEL=gpt-4.1-mini
      # the separate "understand first" call (intent.py): off — it added ~1.5 s to every turn (1 = on)
      - INTENT_AI=0
      # Optional tuning (max tokens is a ceiling — Bangla replies + voice text need room)
      - BRAIN_TIMEOUT_S=12.0
      - BRAIN_MAX_TOKENS=1800
      - BRAIN_TEMP=0.2
      # 1 = bill/water/call-staff requests are saved to qravy.serviceRequests and the waiter
      # tells guests staff were notified. Keep 0 until a staff screen reads that collection.
      - STAFF_ALERTS_ENABLED=0

      # === Idle finalize + batching ===
      - IDLE_FINALIZE_MS=1200
      - TRANSCRIPT_FLUSH_N=1
      - TRANSCRIPT_FLUSH_MS=500
    depends_on:
      - mongo
    ports:
      - "7071:7071"
      - "7081:7081"
    restart: unless-stopped

  # === Sidecar: continuous export of transcripts to review JSONL ===
  transcripts-exporter:
    image: python:3.11-slim
    working_dir: /app
    # 👇 Explicitly source the same .env the waiter uses, then run watcher
    command: >
      bash -lc "set -a;
                . services/ai-waiter-service/.env;
                set +a;
                pip install --no-cache-dir 'pymongo[srv]' &&
                python fine_tuning/export_transcripts.py --watch
                --mongo \"$MONGO_URI\" --db \"$MONGO_DB\" --coll transcripts"
    env_file:
      - ./services/ai-waiter-service/.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/app
    depends_on:
      - mongo
      - ai-waiter-service
    restart: unless-stopped

networks:
  default:
    driver: bridge

volumes:
  mongo_data:
